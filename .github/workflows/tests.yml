name: Tests & Lint

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'integration_tests/**'
      - 'tests/**'
      - 'uniswap_universal_router_decoder/**'
      - 'pyproject.toml'
      - 'server.json'
      - 'pytest.ini'
      - 'tox.ini'
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'integration_tests/**'
      - 'tests/**'
      - 'uniswap_universal_router_decoder/**'
      - 'pyproject.toml'
      - 'server.json'
      - 'pytest.ini'
      - 'tox.ini'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["all"]

    environment:
      name: Tests

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up supported Python versions
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: |
          3.10
          3.14
    - name: Install tox and any other packages
      run: |
        pip install -U pip
        pip install tox
    - name: Run tox
      run: |
        python --version
        tox
